name: Refresh contributions and publish

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test contribution importer
        run: python3 -m unittest discover -s tests
      - name: Refresh public contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contributions.py --refresh
      - uses: actions/configure-pages@v5
      - name: Package static site
        run: |
          mkdir _site
          cp *.html *.css *.js favicon.ico publickey.pgp CNAME _site/
          cp -R blog _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
